[project]
name = "server-friendly-3dgs-viewer"
version = "0.1.0"
description = "Headless-server friendly Web skeleton for an interactive 3D Gaussian Splatting refinement demo."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
]
gsplat = [
  "gsplat>=1.0",
  "numpy>=1.24",
  "pillow>=10.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
